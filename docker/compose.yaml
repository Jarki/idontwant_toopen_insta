name: ig-reel-downloader

services:
  postgres:
    image: postgres:17.10-alpine
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    expose:
      - "5432"

  postgres-bootstrap:
    build:
      context: ..
      dockerfile: docker/Dockerfile.app
    entrypoint: ["/app/.venv/bin/python", "docker/scripts/postgres_bootstrap.py"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DB_MIGRATION_USER: ${DB_MIGRATION_USER}
      DB_MIGRATION_PASSWORD: ${DB_MIGRATION_PASSWORD}
      DB_APP_USER: ${DB_APP_USER}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD}
      DB_ERROR_API_USER: ${DB_ERROR_API_USER}
      DB_ERROR_API_PASSWORD: ${DB_ERROR_API_PASSWORD}
    restart: "no"


  error-api-migrate:
    build:
      context: ..
      dockerfile: docker/Dockerfile.app
    entrypoint: ["/app/.venv/bin/alembic"]
    command: ["-c", "error_api_alembic.ini", "upgrade", "head"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DB_MIGRATION_URL: ${DB_MIGRATION_URL}
      DB_APP_USER: ${DB_APP_USER}
      DB_ERROR_API_USER: ${DB_ERROR_API_USER}
    restart: "no"

  migrate:
    build:
      context: ..
      dockerfile: docker/Dockerfile.app
    entrypoint: ["/app/.venv/bin/alembic"]
    command: ["upgrade", "head"]
    depends_on:
      postgres-bootstrap:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${DB_MIGRATION_URL}
      DB_APP_USER: ${DB_APP_USER}
      DB_ERROR_API_USER: ${DB_ERROR_API_USER}
    restart: "no"

  downloader:
    build:
      context: ..
      dockerfile: docker/Dockerfile.app
    depends_on:
      error-api-migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${DATABASE_URL}
      BOT_TOKEN: ${BOT_TOKEN}
      OUTPUT_DIR: ${OUTPUT_DIR:-output}
      MAX_FILES: "${MAX_FILES:-100}"
      TELEGRAM_MEDIA_WRITE_TIMEOUT: "${TELEGRAM_MEDIA_WRITE_TIMEOUT:-120}"
      TELEGRAM_READ_TIMEOUT: "${TELEGRAM_READ_TIMEOUT:-30}"
      JUDGMENTAL_CHANCE: "${JUDGMENTAL_CHANCE:-0}"
      INSTAGRAM_REEL_DOWNLOADER_ENABLED: "${INSTAGRAM_REEL_DOWNLOADER_ENABLED:-true}"
      INSTAGRAM_POST_DOWNLOADER_ENABLED: "${INSTAGRAM_POST_DOWNLOADER_ENABLED:-true}"
      TIKTOK_DOWNLOADER_ENABLED: "${TIKTOK_DOWNLOADER_ENABLED:-true}"
      REDDIT_DOWNLOADER_ENABLED: "${REDDIT_DOWNLOADER_ENABLED:-true}"
      X_DOWNLOADER_ENABLED: "${X_DOWNLOADER_ENABLED:-true}"
      YOUTUBE_DOWNLOADER_ENABLED: "${YOUTUBE_DOWNLOADER_ENABLED:-true}"
      ERROR_LEDGER_ENABLED: "${ERROR_LEDGER_ENABLED:-true}"
      APP_RELEASE: "${APP_RELEASE:-development}"
      ERROR_REPORTER_QUEUE_SIZE: "${ERROR_REPORTER_QUEUE_SIZE:-256}"
      ERROR_REPORTER_RETRIES: "${ERROR_REPORTER_RETRIES:-2}"
      ERROR_REPORTER_RETRY_BACKOFF_SECONDS: "${ERROR_REPORTER_RETRY_BACKOFF_SECONDS:-0.05}"
    volumes:
      - ../${OUTPUT_DIR:-output}:/app/${OUTPUT_DIR:-output}
      - ../assets:/app/assets
    restart: unless-stopped

  error-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.app
    entrypoint: ["/app/.venv/bin/python", "-m", "error_api"]
    depends_on:
      error-api-migrate:
        condition: service_completed_successfully
    environment:
      ERROR_API_DATABASE_URL: ${ERROR_API_DATABASE_URL}
      ERROR_API_READ_KEY: ${ERROR_API_READ_KEY}
      ERROR_API_READ_LABEL: ${ERROR_API_READ_LABEL}
      ERROR_API_READ_KEY_NEXT: "${ERROR_API_READ_KEY_NEXT:-}"
      ERROR_API_READ_LABEL_NEXT: "${ERROR_API_READ_LABEL_NEXT:-}"
      ERROR_API_TRIAGE_KEY: ${ERROR_API_TRIAGE_KEY}
      ERROR_API_TRIAGE_LABEL: ${ERROR_API_TRIAGE_LABEL}
      ERROR_API_TRIAGE_KEY_NEXT: "${ERROR_API_TRIAGE_KEY_NEXT:-}"
      ERROR_API_TRIAGE_LABEL_NEXT: "${ERROR_API_TRIAGE_LABEL_NEXT:-}"
      ERROR_API_HOST: "0.0.0.0"
      ERROR_API_PORT: "8000"
      ERROR_API_STATEMENT_TIMEOUT_MS: "${ERROR_API_STATEMENT_TIMEOUT_MS:-3000}"
    ports:
      - "127.0.0.1:${ERROR_API_HOST_PORT:-8000}:8000"
    restart: unless-stopped

volumes:
  pgdata:
