services:
  migrate:
    build: !reset null
    image: ghcr.io/jarki/idontwant_toopen_insta:${IMAGE_TAG:-prod}

  error-api-migrate:
    build: !reset null
    image: ghcr.io/jarki/idontwant_toopen_insta:${IMAGE_TAG:-prod}

  downloader:
    build: !reset null
    image: ghcr.io/jarki/idontwant_toopen_insta:${IMAGE_TAG:-prod}

  error-api:
    build: !reset null
    image: ghcr.io/jarki/idontwant_toopen_insta:${IMAGE_TAG:-prod}
    ports: !override
      - "127.0.0.1:${ERROR_API_HOST_PORT:-8000}:8000"

  postgres-bootstrap:
    build: !reset null
    image: ghcr.io/jarki/idontwant_toopen_insta:${IMAGE_TAG:-prod}

  dashboard:
    profiles: [dashboard]
    build: !reset null
    image: ghcr.io/jarki/idontwant_toopen_insta:${IMAGE_TAG:-prod}
    ports: !override
      - "${DASHBOARD_BIND_HOST:-0.0.0.0}:${DASHBOARD_PORT:-8080}:8080"

  dashboard-bootstrap:
    profiles: [dashboard]
    build: !reset null
    image: ghcr.io/jarki/idontwant_toopen_insta:${IMAGE_TAG:-prod}
